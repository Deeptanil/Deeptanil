<svg width="860" height="70" viewBox="0 0 860 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .comic-font {
        font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Hard Shadow -->
  <rect x="8" y="10" width="844" height="52" rx="8" fill="#000000" />
  <!-- Main Pill -->
  <rect x="4" y="6" width="844" height="52" rx="8" fill="#FF2A85" stroke="#000000" stroke-width="3.5" />

  <!-- Comic Star on left -->
  <g transform="translate(32, 32)">
    <polygon points="0,-14 5,-4 15,-5 7,3 11,14 1,7 -8,12 -4,2 -13,-5 -2,-5" fill="#FFE600" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Title -->
  <text x="65" y="41" fill="#FFFFFF" class="comic-font" font-size="24">
    ORIGIN STORY // MISSION &amp; ACADEMICS
  </text>

  <!-- Right Pill Badge -->
  <g transform="translate(680, 16)">
    <rect x="3" y="3" width="145" height="32" rx="6" fill="#000000" />
    <rect x="0" y="0" width="145" height="32" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <text x="72" y="21" fill="#000000" text-anchor="middle" class="comic-font" font-size="12">
      📍 BENGALURU, IN
    </text>
  </g>
</svg>
