<svg width="165" height="48" viewBox="0 0 165 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .comic-btn {
        font-family: 'Space Grotesk', 'Impact', sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-size: 13px;
      }
    </style>
  </defs>
  <!-- Hard Shadow -->
  <rect x="4" y="4" width="157" height="40" rx="8" fill="#000000" />
  <!-- Button Base -->
  <rect x="1" y="1" width="157" height="40" rx="8" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
  <!-- Vector Globe Icon -->
  <circle cx="28" cy="21" r="7.5" stroke="#000000" stroke-width="1.8" fill="none" />
  <line x1="20.5" y1="21" x2="35.5" y2="21" stroke="#000000" stroke-width="1.5" />
  <ellipse cx="28" cy="21" rx="3.5" ry="7.5" stroke="#000000" stroke-width="1.5" fill="none" />
  <text x="92" y="26" fill="#000000" text-anchor="middle" class="comic-btn">
    PORTFOLIO
  </text>
</svg>
