<svg width="860" height="340" viewBox="0 0 860 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="matrix-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20202E" />
    </pattern>
    <style>
      .font-display {
        font-family: 'Bungee', 'Impact', sans-serif;
      }
      .font-heading {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </defs>

  <rect x="10" y="10" width="840" height="320" rx="12" fill="#000000" />
  <rect x="4" y="4" width="840" height="320" rx="12" fill="#0B0E17" stroke="#000000" stroke-width="3.5" />
  <rect x="4" y="4" width="840" height="320" rx="12" fill="url(#matrix-dots)" />

  <!-- Quadrant 1: Languages -->
  <g transform="translate(26, 22)">
    <rect x="3" y="3" width="380" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="380" height="135" rx="8" fill="#131929" stroke="#FFE600" stroke-width="2" />
    <rect x="12" y="10" width="165" height="26" rx="5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <text x="94" y="27" fill="#000000" text-anchor="middle" class="font-heading" font-size="12">
      CORE LANGUAGES
    </text>
    <text x="14" y="62" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Python 3.14 <tspan fill="#8E9BB0">(Flask, Security, Pytest)</tspan>
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] TypeScript &amp; JS <tspan fill="#8E9BB0">(Modern ES6+, Node.js)</tspan>
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] C, Java, SQL, HTML5, Modern CSS3
    </text>
  </g>

  <!-- Quadrant 2: Frameworks & Runtimes -->
  <g transform="translate(434, 22)">
    <rect x="3" y="3" width="395" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="395" height="135" rx="8" fill="#131929" stroke="#00F0FF" stroke-width="2" />
    <rect x="12" y="10" width="200" height="26" rx="5" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <text x="112" y="27" fill="#000000" text-anchor="middle" class="font-heading" font-size="12">
      FRAMEWORKS &amp; RUNTIMES
    </text>
    <text x="14" y="62" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Next.js 15 (SSR / App Router) &amp; React 19
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] React Native &amp; Expo SDK 57 (Reanimated)
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Medusa v2 (Headless Engine) &amp; Odoo ERP
    </text>
  </g>

  <!-- Quadrant 3: Cloud & Infrastructure -->
  <g transform="translate(26, 175)">
    <rect x="3" y="3" width="380" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="380" height="135" rx="8" fill="#131929" stroke="#FF2E93" stroke-width="2" />
    <rect x="12" y="10" width="180" height="26" rx="5" fill="#FF2E93" stroke="#000000" stroke-width="1.5" />
    <text x="102" y="27" fill="#FFFFFF" text-anchor="middle" class="font-heading" font-size="12">
      CLOUD &amp; INFRASTRUCTURE
    </text>
    <text x="14" y="62" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Oracle Cloud (OCI ARM) &amp; Docker
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] PostgreSQL (Neon Serverless) &amp; Supabase
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Redis Cache, Backblaze B2 S3, Nginx SSL
    </text>
  </g>

  <!-- Quadrant 4: Architecture & Systems -->
  <g transform="translate(434, 175)">
    <rect x="3" y="3" width="395" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="395" height="135" rx="8" fill="#131929" stroke="#00FF66" stroke-width="2" />
    <rect x="12" y="10" width="195" height="26" rx="5" fill="#00FF66" stroke="#000000" stroke-width="1.5" />
    <text x="110" y="27" fill="#000000" text-anchor="middle" class="font-heading" font-size="12">
      CRAFT &amp; METHODOLOGY
    </text>
    <text x="14" y="62" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Cryptographic SHA-256 Gates &amp; Zero-Knowledge
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] 100/100 PageSpeed SEO &amp; E-Commerce Conversion
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="font-mono" font-size="12.5" font-weight="bold">
      [+] Google Certified UX Design &amp; AI-Assisted Dev
    </text>
  </g>
</svg>
