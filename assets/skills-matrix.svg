<svg width="860" height="340" viewBox="0 0 860 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="matrix-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20202E" />
    </pattern>
    <style>
      .comic-font {
        font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      .mono-text {
        font-family: 'Consolas', 'Courier New', monospace;
      }
      .category-title {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 15px;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Hard Shadow -->
  <rect x="10" y="10" width="840" height="320" rx="12" fill="#000000" />
  <!-- Card Base -->
  <rect x="4" y="4" width="840" height="320" rx="12" fill="#101017" stroke="#000000" stroke-width="3.5" />
  <rect x="4" y="4" width="840" height="320" rx="12" fill="url(#matrix-dots)" />

  <!-- Quadrant 1: Languages (Top Left) -->
  <g transform="translate(26, 22)">
    <rect x="3" y="3" width="380" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="380" height="135" rx="8" fill="#181824" stroke="#FFE600" stroke-width="2" />
    <!-- Header Pill -->
    <rect x="12" y="10" width="165" height="26" rx="5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <text x="94" y="27" fill="#000000" text-anchor="middle" class="comic-font category-title">
      ⚡ CORE LANGUAGES
    </text>
    <!-- Content Chips -->
    <text x="14" y="62" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Python 3.14 <tspan fill="#A0A0C0">(Flask, Security, Pytest)</tspan>
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • TypeScript &amp; JavaScript <tspan fill="#A0A0C0">(Modern ES6+)</tspan>
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • C, Java, SQL, HTML5, Modern CSS3
    </text>
  </g>

  <!-- Quadrant 2: Frameworks & Runtimes (Top Right) -->
  <g transform="translate(434, 22)">
    <rect x="3" y="3" width="395" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="395" height="135" rx="8" fill="#181824" stroke="#00F0FF" stroke-width="2" />
    <!-- Header Pill -->
    <rect x="12" y="10" width="200" height="26" rx="5" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <text x="112" y="27" fill="#000000" text-anchor="middle" class="comic-font category-title">
      🚀 FRAMEWORKS &amp; RUNTIMES
    </text>
    <!-- Content Chips -->
    <text x="14" y="62" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Next.js 15 (SSR / App Router) &amp; React 19
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • React Native &amp; Expo SDK 57 (Reanimated)
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Medusa v2 (Headless Engine) &amp; Odoo ERP
    </text>
  </g>

  <!-- Quadrant 3: Cloud, DB & Infrastructure (Bottom Left) -->
  <g transform="translate(26, 175)">
    <rect x="3" y="3" width="380" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="380" height="135" rx="8" fill="#181824" stroke="#FF2A85" stroke-width="2" />
    <!-- Header Pill -->
    <rect x="12" y="10" width="180" height="26" rx="5" fill="#FF2A85" stroke="#000000" stroke-width="1.5" />
    <text x="102" y="27" fill="#FFFFFF" text-anchor="middle" class="comic-font category-title">
      ☁️ CLOUD &amp; INFRASTRUCTURE
    </text>
    <!-- Content Chips -->
    <text x="14" y="62" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Oracle Cloud (OCI ARM) &amp; Docker
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • PostgreSQL (Neon Serverless) &amp; Supabase
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Redis Cache, Backblaze B2 S3, Nginx SSL
    </text>
  </g>

  <!-- Quadrant 4: Architecture & Systems (Bottom Right) -->
  <g transform="translate(434, 175)">
    <rect x="3" y="3" width="395" height="135" rx="8" fill="#000000" />
    <rect x="0" y="0" width="395" height="135" rx="8" fill="#181824" stroke="#10B981" stroke-width="2" />
    <!-- Header Pill -->
    <rect x="12" y="10" width="195" height="26" rx="5" fill="#10B981" stroke="#000000" stroke-width="1.5" />
    <text x="110" y="27" fill="#FFFFFF" text-anchor="middle" class="comic-font category-title">
      🛡️ CRAFT &amp; METHODOLOGY
    </text>
    <!-- Content Chips -->
    <text x="14" y="62" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Cryptographic SHA-256 Gates &amp; Zero-Knowledge
    </text>
    <text x="14" y="84" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • 100/100 PageSpeed SEO &amp; E-Commerce Conversion
    </text>
    <text x="14" y="106" fill="#FFFFFF" class="mono-text" font-size="12.5" font-weight="bold">
      • Google Certified UX Design &amp; AI-Assisted Dev
    </text>
  </g>
</svg>

