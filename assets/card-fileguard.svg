<svg width="420" height="340" viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="card-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20202E" />
    </pattern>
    <style>
      .font-display {
        font-family: 'Bungee', 'Impact', sans-serif;
        text-transform: uppercase;
      }
      .font-heading {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </defs>

  <rect x="8" y="8" width="404" height="324" rx="12" fill="#000000" />
  <rect x="2" y="2" width="404" height="324" rx="12" fill="#0B0E17" stroke="#000000" stroke-width="3.5" />
  <rect x="2" y="2" width="404" height="324" rx="12" fill="url(#card-dots)" />

  <!-- Top Yellow Accent Header -->
  <rect x="18" y="16" width="372" height="34" rx="6" fill="#000000" />
  <rect x="15" y="13" width="372" height="34" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
  <!-- Vector Shield -->
  <path d="M28 20 L33 18 L38 20 V26 C38 29 33 32 33 32 C33 32 28 29 28 26 Z" stroke="#000000" stroke-width="1.8" fill="none" />
  <text x="44" y="35" fill="#000000" class="font-heading" font-size="12.5" letter-spacing="1">
    FILEGUARD // ZERO-KNOWLEDGE VAULT
  </text>
  <circle cx="368" cy="30" r="5" fill="#FF2E93" stroke="#000000" stroke-width="2" />

  <!-- Title with 3D Pink Offset -->
  <g transform="translate(3, 3)">
    <text x="20" y="85" fill="#FF2E93" class="font-display" font-size="22" stroke="#000000" stroke-width="4.5" stroke-linejoin="round">
      EPHEMERAL FILE VAULT
    </text>
  </g>
  <text x="20" y="85" fill="#FFFFFF" class="font-display" font-size="22" stroke="#000000" stroke-width="3" stroke-linejoin="round">
    EPHEMERAL FILE VAULT
  </text>

  <!-- Subtitle Tagline -->
  <text x="20" y="108" fill="#00F0FF" class="font-mono" font-size="11.5" font-weight="bold">
    Strict 12h Expiration • Cryptographic Gate • Zero Accounts
  </text>

  <!-- Metrics Badges -->
  <!-- Pill 1 -->
  <rect x="22" y="125" width="112" height="26" rx="5" fill="#000000" />
  <rect x="20" y="123" width="112" height="26" rx="5" fill="#FF2E93" stroke="#000000" stroke-width="2" />
  <text x="76" y="140" fill="#FFFFFF" text-anchor="middle" class="font-heading" font-size="10.5">
    12H AUTO-PURGE
  </text>

  <!-- Pill 2 -->
  <rect x="142" y="125" width="128" height="26" rx="5" fill="#000000" />
  <rect x="140" y="123" width="128" height="26" rx="5" fill="#00F0FF" stroke="#000000" stroke-width="2" />
  <text x="204" y="140" fill="#000000" text-anchor="middle" class="font-heading" font-size="10.5">
    SHA-256 PRE-FLIGHT
  </text>

  <!-- Pill 3 -->
  <rect x="278" y="125" width="108" height="26" rx="5" fill="#000000" />
  <rect x="276" y="123" width="108" height="26" rx="5" fill="#FFE600" stroke="#000000" stroke-width="2" />
  <text x="330" y="140" fill="#000000" text-anchor="middle" class="font-heading" font-size="10.5">
    10-THREAD S3
  </text>

  <!-- Description Box -->
  <rect x="20" y="162" width="364" height="74" rx="6" fill="#131929" stroke="#1E293B" stroke-width="1.5" />
  <text x="32" y="184" fill="#E2E8F0" class="font-mono" font-size="11">
    [+] Zero-knowledge encrypted transfers with in-memory ZIPs.
  </text>
  <text x="32" y="202" fill="#E2E8F0" class="font-mono" font-size="11">
    [+] Pre-flight SHA-256 gate blocks tampered bytes (HTTP 409).
  </text>
  <text x="32" y="220" fill="#E2E8F0" class="font-mono" font-size="11">
    [+] High-speed parallel Backblaze B2 S3 multipart pipeline.
  </text>

  <!-- Tech Stack Chips -->
  <text x="20" y="256" fill="#8E9BB0" class="font-mono" font-size="11" font-weight="bold">
    STACK: <tspan fill="#FFE600">Python 3.14</tspan> • <tspan fill="#00F0FF">Flask</tspan> • <tspan fill="#FF2E93">Neon Postgres</tspan> • <tspan fill="#FFFFFF">Backblaze B2</tspan>
  </text>

  <!-- Action Button -->
  <rect x="23" y="278" width="360" height="38" rx="7" fill="#000000" />
  <rect x="20" y="275" width="360" height="38" rx="7" fill="#FF2E93" stroke="#000000" stroke-width="2.5" />
  <text x="200" y="299" fill="#FFFFFF" text-anchor="middle" class="font-heading" font-size="13" letter-spacing="1">
    LAUNCH FILEGUARD // (FILES.DEEPTANIL.IN)
  </text>
</svg>
