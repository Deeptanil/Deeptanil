<svg width="860" height="70" viewBox="0 0 860 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-display {
        font-family: 'Bungee', 'Impact', sans-serif;
        letter-spacing: 1.5px;
      }
      .font-heading {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 800;
      }
    </style>
  </defs>

  <rect x="8" y="10" width="844" height="52" rx="8" fill="#000000" />
  <rect x="4" y="6" width="844" height="52" rx="8" fill="#FFE600" stroke="#000000" stroke-width="3.5" />

  <!-- Vector Terminal Prompt Icon -->
  <g transform="translate(26, 22)">
    <polyline points="2,4 8,10 2,16" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="11" y1="16" x2="19" y2="16" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  </g>

  <text x="56" y="40" fill="#000000" class="font-display" font-size="20">
    FEATURED PRODUCTION DISPATCHES // SHIPPED SYSTEMS
  </text>

  <!-- Right Pill Badge -->
  <g transform="translate(700, 16)">
