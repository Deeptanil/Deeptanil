    <rect x="0" y="0" width="130" height="32" rx="6" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="65" y="21" fill="#000000" text-anchor="middle" class="font-heading" font-size="12">
      ZERO-TO-ONE
    </text>
