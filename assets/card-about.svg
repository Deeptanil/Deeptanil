<svg width="860" height="230" viewBox="0 0 860 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="about-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20202E" />
    </pattern>
    <style>
      .font-display {
        font-family: 'Bungee', 'Impact', sans-serif;
      }
      .font-heading {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </defs>

  <rect x="8" y="8" width="844" height="214" rx="12" fill="#000000" />
  <rect x="2" y="2" width="844" height="214" rx="12" fill="#0B0E17" stroke="#000000" stroke-width="3.5" />
  <rect x="2" y="2" width="844" height="214" rx="12" fill="url(#about-dots)" />

  <g transform="translate(24, 20)">
    <text x="0" y="25" fill="#FFE600" class="font-display" font-size="16">
      BUILDER // CO-FOUNDER // SYSTEMS CRAFTSMAN
    </text>
    
    <text x="0" y="58" fill="#F1F5F9" class="font-mono" font-size="13">
      I engineer digital products at the convergence of <tspan fill="#FF2E93" font-weight="bold">systems performance</tspan>, <tspan fill="#00F0FF" font-weight="bold">intuitive UX</tspan>,
    </text>
    <text x="0" y="80" fill="#F1F5F9" class="font-mono" font-size="13">
      and <tspan fill="#FFE600" font-weight="bold">sound architecture</tspan>. From self-hosting headless commerce on Oracle ARM Cloud to
    </text>
    <text x="0" y="102" fill="#F1F5F9" class="font-mono" font-size="13">
      writing zero-knowledge cryptographic integrity gates and 60 FPS mobile discovery apps,
    </text>
    <text x="0" y="124" fill="#F1F5F9" class="font-mono" font-size="13">
      I take ideas from zero to production at breakneck speed.
    </text>

    <!-- Academic & Cert Strip -->
    <g transform="translate(0, 144)">
      <rect x="2" y="2" width="410" height="34" rx="6" fill="#000000" />
      <rect x="0" y="0" width="410" height="34" rx="6" fill="#131929" stroke="#FFE600" stroke-width="1.5" />
      <text x="14" y="22" fill="#FFE600" class="font-mono" font-size="12" font-weight="bold">
        [EDU] Manipal Institute of Technology ('28)
      </text>
      <text x="310" y="22" fill="#8E9BB0" class="font-mono" font-size="12">
        B.Tech in IT
      </text>

      <rect x="432" y="2" width="370" height="34" rx="6" fill="#000000" />
      <rect x="430" y="0" width="370" height="34" rx="6" fill="#131929" stroke="#00F0FF" stroke-width="1.5" />
      <text x="444" y="22" fill="#00F0FF" class="font-mono" font-size="12" font-weight="bold">
        [CERT] Google UX Design Certified
      </text>
      <text x="715" y="22" fill="#8E9BB0" class="font-mono" font-size="12">
        Professional
      </text>
    </g>
  </g>
</svg>
